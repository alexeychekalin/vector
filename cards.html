<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточки для рекламы — Золотой вектор</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/brand/logo/circular.svg" type="image/svg+xml">
<style>
/* ===== Базовые токены бренда (без внешних зависимостей) ===== */
:root{
  --berry:#973568; --berry-dark:#7A2B54; --berry-deep:#5C2040; --berry-light:#AC5D86;
  --sky:#9B89C0; --sky-soft:#C3B8D9; --lavender-soft:#D7D0E6;
  --rose:#D3A3C4; --rose-soft:#E5C8DC; --pink-bright:#F5ACCC;
  --sage:#AABDA1; --sage-soft:#CCD7C7; --sage-tint:#EEF2EC;
  --beige:#CEABB1; --beige-soft:#E2CDD0; --beige-tint:#F5EEEF;
  --gold:#E0A97C; --gold-2:#FFD7A8; --gold-hi:#FFE7C9;
  --cream:#F5EEEF; --bg:#FBF9F7; --ink:#34303F; --muted:#6E6980;

  /* цвета категорий из брендбука */
  --cat-logo:#E4CDCB;   /* логопедия        228 205 218 */
  --cat-def:#D3D1EA;    /* дефектология     211 209 234 */
  --cat-diag:#FAAFD3;   /* диагностика      250 175 211 */
  --cat-neuro:#D3DBC8;  /* нейропсихология  211 219 200 */
  --cat-school:#FCD6E9; /* подготовка к школе 252 214 233 */
  --cat-comp:#E3CDCB;   /* Вектор открытий  227 205 218 */

  --accent: var(--cat-logo);
  --accent-ink: #6d4a48;
}
@font-face{font-family:'Evolventa';font-weight:400;font-style:normal;font-display:swap;src:url('assets/fonts/evolventa/Evolventa-Regular.woff') format('woff');}
@font-face{font-family:'Evolventa';font-weight:600;font-style:normal;font-display:swap;src:url('assets/fonts/evolventa/Evolventa-Bold.woff') format('woff');}
@font-face{font-family:'Evolventa';font-weight:700;font-style:normal;font-display:swap;src:url('assets/fonts/evolventa/Evolventa-Bold.woff') format('woff');}
@font-face{font-family:'Evolventa';font-weight:800;font-style:normal;font-display:swap;src:url('assets/fonts/evolventa/Evolventa-Bold.woff') format('woff');}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Evolventa','Nunito',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ===== Панель управления (не попадает в PNG) ===== */
.toolbar{
  position:sticky;top:0;z-index:50;
  background:rgba(52,48,63,.96);color:#fff;
  padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  backdrop-filter:blur(8px);
}
.toolbar h1{font-size:.95rem;font-weight:600;margin-right:auto;}
.toolbar button,.toolbar select{
  font:inherit;font-size:.82rem;border:none;border-radius:999px;cursor:pointer;
  padding:8px 16px;background:var(--berry);color:#fff;transition:filter .15s;
}
.toolbar button:hover{filter:brightness(1.12);}
.toolbar button.alt{background:rgba(255,255,255,.14);}
.toolbar label{font-size:.82rem;display:flex;gap:8px;align-items:center;}
.toolbar input[type=number]{width:76px;padding:6px 8px;border-radius:8px;border:none;font:inherit;font-size:.82rem;}
.hint{font-size:.75rem;opacity:.7;width:100%;}

/* ===== Сетка карточек ===== */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:28px;padding:32px clamp(16px,4vw,48px) 80px;max-width:1600px;margin:0 auto;
}
.card-slot{display:flex;flex-direction:column;gap:10px;}
.slot-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);}
.slot-meta b{color:var(--ink);font-weight:600;}
.slot-actions{display:flex;gap:8px;}
.slot-actions button{
  font:inherit;font-size:.75rem;padding:5px 12px;border-radius:999px;border:1px solid var(--beige);
  background:#fff;color:var(--berry-dark);cursor:pointer;transition:all .15s;
}
.slot-actions button:hover{background:var(--berry);color:#fff;border-color:var(--berry);}

/* ===== Квадратная карточка 1:1 ===== */
.ad-card{
  aspect-ratio:1/1;width:100%;
  border-radius:28px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;
  background:linear-gradient(160deg,#ffffff 0%,var(--cream) 55%,color-mix(in srgb,var(--accent) 38%,#fff) 100%);
  box-shadow:0 10px 34px rgba(52,48,63,.10);
  padding:clamp(20px,4.5cqw,40px);
  container-type:inline-size;
}
@supports not (background:color-mix(red,blue)){
  .ad-card{background:linear-gradient(160deg,#fff 0%,var(--cream) 60%,var(--accent) 160%);}
}
.ad-card::before{ /* мягкое пятно акцента */
  content:"";position:absolute;right:-18%;top:-18%;width:56%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,color-mix(in srgb,var(--accent) 75%,transparent),transparent 70%);
  pointer-events:none;
}
.ad-card::after{ /* тонкая золотая линия снизу */
  content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:linear-gradient(90deg,var(--gold),var(--gold-2),var(--gold));
}

.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2;}
.chip{
  font-size:calc(9px + .9cqw);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.5em 1.1em;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
}
.brand-mini{display:flex;align-items:center;gap:.5em;font-size:calc(9px + .8cqw);font-weight:600;color:var(--berry-deep);opacity:.85;}
.brand-mini img{height:2.4em;width:auto;}

.card-headline{
  margin-top:calc(10px + 2cqw);position:relative;z-index:2;
  font-weight:800;line-height:1.14;letter-spacing:-.01em;
  font-size:calc(17px + 3.2cqw);
  color:var(--berry-deep);
  text-wrap:balance;
}
.card-headline em{font-style:normal;color:var(--berry);}

.card-desc{
  margin-top:calc(8px + 1.4cqw);position:relative;z-index:2;
  font-size:calc(10px + 1.15cqw);line-height:1.5;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:5;line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
}

.card-price{
  margin-top:auto;position:relative;z-index:2;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:calc(10px + 2cqw);
}
.price-main{display:flex;flex-direction:column;line-height:1.05;}
.price-from{font-size:calc(9px + 1cqw);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.price-num{font-size:calc(22px + 4.6cqw);font-weight:800;color:var(--berry-deep);}
.price-num small{font-size:.45em;font-weight:700;color:var(--berry-light);}
.price-note{
  font-size:calc(9px + 1cqw);color:var(--accent-ink);font-weight:600;text-align:right;max-width:46%;
  background:color-mix(in srgb,var(--accent) 45%,#fff);border-radius:14px;padding:.6em .9em;
}
@supports not (background:color-mix(red,blue)){.price-note{background:var(--accent);}}

/* категории */
.c-logo  {--accent:var(--cat-logo);  --accent-ink:#6d4a48;}
.c-def   {--accent:var(--cat-def);   --accent-ink:#4b4878;}
.c-diag  {--accent:var(--cat-diag);  --accent-ink:#8a3a63;}
.c-neuro {--accent:var(--cat-neuro); --accent-ink:#4c5e44;}
.c-school{--accent:var(--cat-school);--accent-ink:#8a4a72;}
.c-comp  {--accent:var(--cat-comp);  --accent-ink:#6d4a48;}

@media (max-width:420px){.grid{grid-template-columns:1fr;gap:20px;}}
@media print{.toolbar,.slot-meta{display:none!important;}.grid{display:block;padding:0;}.card-slot{page-break-after:always;}}
</style>
</head>
<body>

<div class="toolbar">
  <h1>🎴 Карточки для рекламных кампаний — «Золотой вектор»</h1>
  <label>Размер PNG:
    <select id="sizeSel">
      <option value="1080">1080×1080 (Яндекс/FB/VK)</option>
      <option value="1200">1200×1200</option>
      <option value="1440">1440×1440</option>
    </select>
  </label>
  <button id="dlAll" class="alt">⬇ Скачать все PNG</button>
  <span class="hint">Каждая карточка квадратная (1:1). Скачивайте по одной кнопкой «PNG» или все сразу. Панель и подписи в файл не попадают.</span>
</div>

<main class="grid" id="grid"></main>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js" defer></script>
<script>
/* ===== Данные: прайс-лист «Золотой вектор», 20 позиций =====
   title  — продающий заголовок (≤250 симв.)
   desc   — продающее описание  (≤1500 симв.)
*/
const CARDS = [
{id:'logo-vektor-rechi', cat:'c-logo', chip:'Логопедия', name:'Кружок «Вектор речи»',
 price:'от 2 900 ₽', note:'Абонемент 8 — 25 200 ₽\nАбонемент 12 — 34 800 ₽',
 title:'Ребёнок говорит, но непонятно? Ставим звуки правильно',
 desc:'«Вектор речи» — системные занятия с логопедом для детей, которые заменяют звуки, «кашают», путают С/Ш, З/Ж или говорят невнятно. На первом занятии логопед определяет, какие звуки нужно ставить и в какой последовательности, а дальше ребёнок занимается по персональному плану: артикуляционная гимнастика, постановка, автоматизация и введение звука в свободную речь. Регулярность важнее длительности: 2–3 занятия в неделю по 30–40 минут дают результат быстрее, чем редкие часовые визиты. Абонемент фиксирует цену занятия ниже разовой и закрепляет за вами одного специалиста — он знает прогресс вашего ребёнка и не тратит время на «знакомство заново». Через 2–3 месяца занятий окружающие начинают понимать ребёнка без переспрашивания.'},

{id:'logo-zapusk-ind', cat:'c-logo', chip:'Логопедия', name:'Кружок «Лёгкий старт», запуск речи · индивидуально',
 price:'от 3 100 ₽', note:'Абонемент 8 — 27 200 ₽\nАбонемент 12 — 37 200 ₽',
 title:'Малышу 2–3 года, а слов всё нет? Запускаем речь',
 desc:'«Лёгкий старт» — индивидуальная программа запуска речи для детей, которые молчат, используют 10–20 «своих» слов или только лепечут. Логопед работает не со словами как таковыми, а с причиной их отсутствия: мышечный тонус лица, понимание речи, сенсорная сфера, мотивация общаться. Занятия строятся через игру и движение — ребёнок не «учит слова», а попадает в ситуацию, где слово нужно, чтобы получить желаемое. Первые звуки и слова обычно появляются в течение 1–2 месяцев регулярных занятий, пассивный словарь растёт уже после первых встреч. Индивидуальный формат важен на старте: специалист видит каждую реакцию малыша и подстраивает темп. Родителями даются простые домашние задания на 10 минут в день — они ускоряют результат в разы.'},

{id:'logo-zapusk-team', cat:'c-logo', chip:'Логопедия', name:'Кружок «Лёгкий старт в команде», запуск речи · мини-группа',
 price:'от 2 950 ₽', note:'Абонемент 8 — 25 600 ₽\nАбонемент 12 — 35 400 ₽',
 title:'Дети говорят охотнее, когда говорят другие дети',
 desc:'Мини-группа «Лёгкий старт в команде» — тот же запуск речи от логопеда, но в компании 2–4 детей с похожей стартовой точкой. Это меняет механику: появляется речевая среда, в которой хочется озвучить просьбу, поделиться находкой, ответить другу. Малыши начинают повторять друг за другом — так слова прилипают быстрее, чем на индивидуальных уроках, а простая конкуренция «у него получилось» включает речевую мотивацию. Для многих семей это ещё и первый социальный опыт: ребёнок учится ждать своей очереди и слышать других. Формат подходит детям, которые уже имеют запас пассивной лексики и готовы к общению с ровесниками. Стоимость занятия ниже индивидуального, а абонемент на 12 посещений — самая выгодная цена направления.'},

{id:'logo-massazh', cat:'c-logo', chip:'Логопедия', name:'Кружок «Нежный звук» · логоритмический массаж',
 price:'от 2 000 ₽', note:'Абонемент 10 — 22 000 ₽\nАбонемент 15 — 30 000 ₽',
 title:'Снимаем напряжение с речевого аппарата',
 desc:'«Нежный звук» — курс логопедического массажа лица, языка и шеи для детей, у которых речь «тормозится» телом: слабый или, наоборот, спазмированный мышечный тонус, вялый язык, повышенное слюнотечение, трудности с переключением артикуляционных поз. Массаж выполняется сертифицированным специалистом мягкими техниками, большинство детей переносят его спокойно и даже засыпают — процедура приятная. Курс из 10–15 сеансов готовит артикуляционный аппарат к звукам: после массажа дети заметно легче берут новые позиции языка и губ. Чаще всего массаж назначают в связке с занятиями логопеда — тогда работа идёт одновременно «по железу» и «по программе», и результат наступает быстрее. Абонемент на весь курс дешевле разовых посещений и гарантирует место в расписании на весь период.'},

{id:'def-vektor-poznaniya', cat:'c-def', chip:'Дефектология', name:'Кружок «Вектор познания»',
 price:'от 3 400 ₽', note:'Абонемент 8 — 30 400 ₽\nАбонемент 12 — 40 800 ₽',
 title:'Познаём мир в том темпе, который нужен вашему ребёнку',
 desc:'«Вектор познания» — занятия с дефектологом для детей, которым сложно даётся обычная программа: медленно запоминают, путают цвета и формы, не могут сосредоточиться на задаче, отстают в понимании инструкций. Дефектолог выстраивает работу вокруг сильных сторон ребёнка — через опору на сохранные каналы восприятия развивает внимание, память, мышление и восприятие. Каждое занятие — это игра с чёткой дидактической целью: ребёнок не замечает, что «занимается развитием», но к концу встречи у него получается то, что не получалось месяц назад. Особенно актуально перед детским садом и школой, где без этих базовых навыков ребёнку приходится тяжело. Абонемент позволяет вести динамику без разрывов — именно регулярность здесь напрямую превращается в результат.'},

{id:'neuro-intellekt', cat:'c-neuro', chip:'Нейропсихология', name:'Кружок «Нейроинтеллект», индивидуально',
 price:'от 3 200 ₽', note:'Абонемент 4 — 16 800 ₽\nАбонемент 8 — 30 400 ₽\nАбонемент 12 — 38 400 ₽',
 title:'Учим мозг работать: внимание, память, самоконтроль',
 desc:'«Нейроинтеллект» — индивидуальные занятия с нейропсихологом, направленные на «фундамент» учебной успешности: мозговую организацию внимания, памяти, планирования и саморегуляции. Формат отличается от обычной психологической работы: много движения — межполушарные упражнения, балансировочные задачи, ритмические серии, блок моторной планировки. Ребёнок «качается, ползает, хлопает», а параллельно тренируются нейронные связи, без которых в школе страдают письмо, счёт и усидчивость. Показан детям, которые быстро устают, «тупят» на ровном месте, не могут начать урок, пишут зеркально или путают право/лево. Первые изменения в собранности родители обычно отмечают через 4–6 недель. Есть абонементы на 4, 8 и 12 занятий — чем длиннее курс, тем ниже цена часа и устойчивее результат.'},

{id:'neuro-intellekt-team', cat:'c-neuro', chip:'Нейропсихология', name:'Кружок «Нейроинтеллект в команде», мини-группа',
 price:'от 2 700 ₽', note:'Абонемент 4 — 12 400 ₽\nАбонемент 8 — 21 600 ₽',
 title:'Нейроупражнения в группе: драйв, соревнование, результат',
 desc:'Групповой формат «Нейроинтеллекта» — те же нейрокоррекционные задачи, что и на индивидуальной работе, но в мини-группе 3–5 детей. Группе нужна синхронизация: выполнить упражнение одновременно с соседом, не сбиться, дождаться своей очереди — и это отдельный мощный тренажер тормозных функций мозга, произвольности и переключаемости. Дети тянутся друг за другом, смех и здоровое соперничество делают занятия, которые дома «не идут», любимыми. Экономия тоже ощутимая: занятие в команде почти на треть дешевле индивидуального, а абонемент на 8 встреч — лучшая цена направления. Подходит как самостоятельный курс лёгких трудностей в обучении и как продолжение индивидуальной работы, когда базовый уровень достигнут.'},

{id:'school-gold-ind', cat:'c-school', chip:'Подготовка к школе', name:'Кружок «Золотой стандарт», индивидуально',
 price:'от 2 800 ₽', note:'Абонемент 8 — 24 400 ₽\nАбонемент 12 — 33 600 ₽',
 title:'В школу — уверенно: читаем, считаем, пишем, не боимся',
 desc:'«Золотой стандарт» — индивидуальная подготовка к школе под конкретного ребёнка, а не по шаблонному групповому плану. Специалист сначала смотрит реальный профиль готовности: фонематический слух, мелкую моторику, логику, навык счета, умение слушать инструкцию и держать задачу до конца. Дальше программа собирается из слабых зон — кто-то приходит подтянуть чтение, кому-то критично научиться не бояться ошибок и сидеть 30 минут. Индивидуальный формат выбирают дети с особым стартом: застенчивые, гиперактивные, с пробелами в речи, которую подтягивают параллельно с логопедом. К сентябрю такой ребёнок идёт в первый класс с ощущением «я умею», а это половина успеха: дальше мотивация учиться держится именно на нём.'},

{id:'school-gold-team', cat:'c-school', chip:'Подготовка к школе', name:'Кружок «Золотой стандарт в команде», мини-группа 6–7 лет',
 price:'от 2 700 ₽', note:'Абонемент 8 — 21 600 ₽',
 title:'Готовимся к школе как к школе: парта, задание, друг рядом',

/* Проверка лимитов (для разработки): */
CARDS.forEach(c=>{
  if(c.title.length>250) console.warn('TITLE >250:', c.id, c.title.length);
  if(c.desc.length>1500) console.warn('DESC >1500:', c.id, c.desc.length);
});

const grid=document.getElementById('grid');
const logo='assets/brand/logo/znak.svg';

CARDS.forEach((c,i)=>{
  const slot=document.createElement('div');
  slot.className='card-slot';
  slot.innerHTML=`
    <div class="ad-card ${c.cat}" id="card-${c.id}">
      <div class="card-top">
        <span class="chip">${c.chip}</span>
        <span class="brand-mini"><img src="${logo}" alt="">Золотой вектор</span>
      </div>
      <h2 class="card-headline">${c.title}</h2>
      <p class="card-desc">${c.desc}</p>
      <div class="card-price">
        <div class="price-main">
          <span class="price-from">${c.name}</span>
          <span class="price-num">${c.price}</span>
        </div>
        <div class="price-note">${c.note.replace(/\n/g,'<br>')}</div>
      </div>
    </div>
    <div class="slot-meta">
      <span><b>${i+1}/${CARDS.length}</b> · ${c.name}</span>
      <span class="slot-actions">
        <button data-id="${c.id}">⬇ PNG</button>
      </span>
    </div>`;
  grid.appendChild(slot);
});

async function downloadCard(id,size){
  const node=document.getElementById('card-'+id);
  if(!window.htmlToImage){alert('Библиотека экспорта ещё грузится, попробуйте через секунду.');return;}
  const blob=await htmlToImage.toPng(node,{pixelRatio:size/node.offsetWidth,width:size,height:size,backgroundColor:null});
  const a=document.createElement('a');
  a.download=id+'.png';a.href=blob;a.click();
}

grid.addEventListener('click',e=>{
  const b=e.target.closest('[data-id]');
  if(b) downloadCard(b.dataset.id,+document.getElementById('sizeSel').value);
});

document.getElementById('dlAll').addEventListener('click',async()=>{
  const size=+document.getElementById('sizeSel').value;
  for(const c of CARDS){await downloadCard(c.id,size);await new Promise(r=>setTimeout(r,400));}
});
</script>
