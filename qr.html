<!DOCTYPE html>
<html lang="ru" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Золотой Вектор — генератор QR-кода</title>
  <meta name="robots" content="noindex" />
  <script>document.documentElement.classList.remove('no-js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/evolventa@5.0.13/index.min.css" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { berry:'#973568','berry-dark':'#7A2B54','berry-deep':'#5C2040',
        gold:'#E0A97C','gold-hi':'#FFE7C9', cream:'#F5EEEF', bg:'#FBF9F7', ink:'#34303F', muted:'#6E6980' },
      fontFamily:{ display:['Evolventa','Nunito','sans-serif'], body:['Nunito','sans-serif'] },
    } } };
  </script>
  <!-- Библиотека QR (локально, без внешних CDN; авто-подбор версии) -->
  <script src="assets/js/qrcode-generator.min.js" defer></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="font-body">
  <div class="aurora" aria-hidden="true"></div>

  <main class="min-h-screen flex flex-col items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <img src="assets/brand/logo/horizontal-full.svg" width="1708" height="429" alt="Золотой Вектор" class="h-16 w-auto mx-auto mb-4" />
        <h1 class="font-display font-600 text-2xl text-ink">Генератор QR-кода</h1>
        <p class="text-muted text-sm mt-1">Вставьте адрес страницы связи и скачайте QR в фирменном стиле.</p>
      </div>

      <div class="glass p-6 space-y-4">
        <div>
          <label for="qrUrl" class="block font-600 text-ink mb-2">Ссылка</label>
          <input type="url" id="qrUrl" value="https://zolotoy-vektor.ru/svyaz.html"
                 class="w-full min-h-[52px] px-4 rounded-2xl bg-white/70 border-2 border-transparent focus:border-berry focus:bg-white outline-none transition-colors text-ink" />
        </div>
        <button id="qrGen" class="btn btn-primary w-full">Сгенерировать</button>

        <p id="qrError" class="hidden text-sm text-berry"></p>

        <div class="flex flex-col items-center gap-4 pt-2">
          <div id="qrWrap" class="p-4 bg-white rounded-2xl inline-block" style="box-shadow:var(--shadow-soft)">
            <canvas id="qrCanvas" width="320" height="320" aria-label="QR-код"></canvas>
          </div>
          <a id="qrDownload" class="btn btn-gold w-full" download="zolotoy-vektor-qr.png">Скачать PNG</a>
        </div>
      </div>

      <p class="text-xs text-muted text-center mt-4">QR ведёт на указанную страницу. Печатайте с полями и не мельче 2×2 см.</p>
    </div>
  </main>

  <script>
    window.addEventListener('load', function () {
      var input = document.getElementById('qrUrl');
      var canvas = document.getElementById('qrCanvas');
      var dl = document.getElementById('qrDownload');
      var errBox = document.getElementById('qrError');
      var SIZE = 320;          // размер холста, px
      var DARK = '#973568';    // фирменная малина
      var LIGHT = '#FFFFFF';

      function draw(text) {
        var ctx = canvas.getContext('2d');
        // typeNumber=0 → библиотека сама подберёт минимальную подходящую версию (до 40)
        var qr = qrcode(0, 'M'); // уровень коррекции M даёт запас по объёму данных
        qr.addData(text);
        qr.make();

        var count = qr.getModuleCount();
        var quiet = 4;                       // тихая зона (модули)
        var total = count + quiet * 2;
        var cell = Math.floor(SIZE / total); // целочисленный размер модуля — без размытия
        var dim = cell * total;
        canvas.width = dim; canvas.height = dim;

        ctx.fillStyle = LIGHT; ctx.fillRect(0, 0, dim, dim);
        ctx.fillStyle = DARK;
        for (var r = 0; r < count; r++) {
          for (var c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
            }
          }
        }
      }

      function render() {
        if (typeof qrcode === 'undefined') return;
        var text = input.value.trim() || ' ';
        try {
          errBox.classList.add('hidden');
          draw(text);
          dl.href = canvas.toDataURL('image/png');
        } catch (e) {
          errBox.textContent = 'Не удалось построить QR: ' + (e && e.message ? e.message : e);
          errBox.classList.remove('hidden');
        }
      }

      document.getElementById('qrGen').addEventListener('click', render);
      input.addEventListener('input', render);
      render();
    });
  </script>
</body>
</html>
